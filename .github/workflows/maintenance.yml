name: Maintenance

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 1 * * 1"
  workflow_dispatch:
    inputs:
      task:
        description: Maintenance task to run.
        required: true
        default: all
        type: choice
        options: [all, board, stale, translation, leaderboard, unassign, flaky, benchmark-memory-7280]
      milestone:
        description: Optional maintainer-board milestone.
        required: false
        default: v0.4
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ${{ inputs.task == 'benchmark-memory-7280' && format('benchmark-memory-7280-{0}', github.run_id)
    || format('maintenance-{0}', github.event.schedule || inputs.task || 'manual') }}
  cancel-in-progress: false

jobs:
  board:
    name: Maintainer board
    if: >-
      (github.repository == 'vllm-project/semantic-router'
        && github.event.schedule == '0 8 * * *')
      || (github.event_name == 'workflow_dispatch'
        && (inputs.task == 'all' || inputs.task == 'board'))
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/maintainer-board.yml
    with:
      milestone: ${{ inputs.milestone || 'v0.4' }}
    secrets: inherit

  stale:
    name: Stale lifecycle
    if: >-
      (github.repository == 'vllm-project/semantic-router'
        && github.event.schedule == '0 8 * * *')
      || (github.event_name == 'workflow_dispatch'
        && (inputs.task == 'all' || inputs.task == 'stale'))
    permissions:
      contents: read
      issues: write
      pull-requests: write
    uses: ./.github/workflows/stale.yml
    secrets: inherit

  translation:
    name: Translation status
    if: >-
      (github.repository == 'vllm-project/semantic-router'
        && github.event.schedule == '0 1 * * 1')
      || (github.event_name == 'workflow_dispatch'
        && (inputs.task == 'all' || inputs.task == 'translation'))
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/check-translation-staleness.yml
    secrets: inherit

  leaderboard:
    name: Contributor leaderboard
    if: >-
      (github.repository == 'vllm-project/semantic-router'
        && github.event.schedule == '0 1 * * 1')
      || (github.event_name == 'workflow_dispatch'
        && (inputs.task == 'all' || inputs.task == 'leaderboard'))
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/contributor-leaderboard.yml
    secrets: inherit

  unassign:
    name: Unassign inactive assignees
    if: >-
      (github.repository == 'vllm-project/semantic-router'
        && github.event.schedule == '0 8 * * *')
      || (github.event_name == 'workflow_dispatch'
        && (inputs.task == 'all' || inputs.task == 'unassign'))
    permissions:
      contents: read
      issues: write
      pull-requests: read
    uses: ./.github/workflows/unassign-inactive-assignees.yml
    secrets: inherit

  flaky:
    name: Flaky e2e tests
    if: >-
      (github.repository == 'vllm-project/semantic-router'
        && github.event.schedule == '0 8 * * *')
      || (github.event_name == 'workflow_dispatch'
        && (inputs.task == 'all' || inputs.task == 'flaky'))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/flaky-tests.yml
    secrets: inherit

  benchmark-memory-7280:
    name: Production benchmark memory
    if: >-
      github.repository == 'liuxiaocs7/semantic-router-pr-7268-full-ci'
      && github.event_name == 'workflow_dispatch'
      && inputs.task == 'benchmark-memory-7280'
    uses: ./.github/workflows/benchmark-memory-7280.yml
